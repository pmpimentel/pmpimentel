<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="320" viewBox="0 0 1100 320" role="img" aria-label="Pedro data signal">
  <defs>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0%" stop-color="#8BE9FD" stop-opacity="0"/>
      <stop offset="12%" stop-color="#8BE9FD" stop-opacity=".45"/>
      <stop offset="88%" stop-color="#8BE9FD" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#8BE9FD" stop-opacity="0"/>
    </linearGradient>

    <style>
      text {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .mono {
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      }
      .soft { fill: #7d8791; }
      .main { fill: #e8edf2; }
      .accent { fill: #8BE9FD; }
      .thin { stroke: #8BE9FD; stroke-opacity: .18; }
      .label { font-size: 11px; letter-spacing: 1.8px; }
      .tech { font-size: 12px; letter-spacing: 1.2px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1100" height="320" rx="18" fill="#0a0d10"/>

  <!-- subtle frame -->
  <rect x="12" y="12" width="1076" height="296" rx="14" fill="none" stroke="#ffffff" stroke-opacity=".055"/>

  <!-- left identity -->
  <g transform="translate(58 64)">
    <text class="main" font-size="38" font-weight="700" letter-spacing="-1">Pedro</text>
    <text y="31" class="soft mono label">COMPUTER SCIENCE / PUCPR</text>

    <text y="90" class="main" font-size="18" font-weight="600">Software + Data</text>
    <text y="116" class="soft" font-size="13">Building practical things with code,</text>
    <text y="136" class="soft" font-size="13">analysis and continuous learning.</text>

    <g transform="translate(0 190)">
      <circle cx="4" cy="0" r="4" fill="#8BE9FD"/>
      <text x="16" y="4" class="soft mono" font-size="11">focus / data &amp; analytics</text>
    </g>
  </g>

  <!-- separator -->
  <line x1="365" y1="46" x2="365" y2="274" stroke="#ffffff" stroke-opacity=".07"/>

  <!-- right header -->
  <g transform="translate(412 56)">
    <text class="soft mono label">SIGNAL_01</text>
    <text x="578" class="soft mono label" text-anchor="end">LIVE FLOW</text>
  </g>

  <!-- baseline -->
  <line x1="412" y1="165" x2="1000" y2="165" stroke="url(#fade)" stroke-width="1"/>

  <!-- waveform -->
  <path id="wave"
        d="M412 165
           C440 165 452 165 468 165
           C481 165 487 137 499 137
           C512 137 516 193 529 193
           C542 193 547 148 560 148
           C573 148 580 165 596 165
           C626 165 638 165 654 165
           C668 165 673 119 688 119
           C702 119 708 211 724 211
           C740 211 748 151 765 151
           C782 151 789 165 806 165
           C836 165 850 165 867 165
           C882 165 889 141 903 141
           C917 141 924 188 939 188
           C954 188 961 165 978 165
           C986 165 993 165 1000 165"
        fill="none" stroke="#8BE9FD" stroke-opacity=".75" stroke-width="1.6"/>

  <!-- moving pulse -->
  <circle r="4.2" fill="#d7fbff" filter="url(#glow)">
    <animateMotion dur="7.5s" repeatCount="indefinite">
      <mpath href="#wave"/>
    </animateMotion>
  </circle>

  <!-- trailing pulse -->
  <circle r="2.4" fill="#8BE9FD" opacity=".35">
    <animateMotion dur="7.5s" begin="-0.18s" repeatCount="indefinite">
      <mpath href="#wave"/>
    </animateMotion>
  </circle>

  <!-- tech checkpoints -->
  <g class="mono">
    <g transform="translate(472 230)">
      <line y1="-46" y2="-12" class="thin"/>
      <circle cy="-50" r="2.5" fill="#8BE9FD"/>
      <text class="main tech">PYTHON</text>
      <text y="18" class="soft" font-size="10">analysis</text>
    </g>

    <g transform="translate(611 230)">
      <line y1="-46" y2="-12" class="thin"/>
      <circle cy="-50" r="2.5" fill="#8BE9FD"/>
      <text class="main tech">SQL</text>
      <text y="18" class="soft" font-size="10">query</text>
    </g>

    <g transform="translate(733 230)">
      <line y1="-46" y2="-12" class="thin"/>
      <circle cy="-50" r="2.5" fill="#8BE9FD"/>
      <text class="main tech">PANDAS</text>
      <text y="18" class="soft" font-size="10">transform</text>
    </g>

    <g transform="translate(892 230)">
      <line y1="-46" y2="-12" class="thin"/>
      <circle cy="-50" r="2.5" fill="#8BE9FD"/>
      <text class="main tech">POWER BI</text>
      <text y="18" class="soft" font-size="10">visualize</text>
    </g>
  </g>

  <!-- animated cursor / footer -->
  <g transform="translate(412 284)">
    <text class="soft mono" font-size="11">input</text>
    <text x="48" class="main mono" font-size="11">curiosity</text>
    <text x="118" class="soft mono" font-size="11">→</text>
    <text x="140" class="main mono" font-size="11">data</text>
    <text x="174" class="soft mono" font-size="11">→</text>
    <text x="196" class="main mono" font-size="11">insight</text>
    <rect x="244" y="-9" width="7" height="12" fill="#8BE9FD">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- tiny corner index -->
  <text x="1046" y="292" text-anchor="end" class="soft mono" font-size="9" letter-spacing="1.4">P/01</text>
</svg>
